[project]
name = "rag-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emmanuel Massawe", email = "emmanuelmassawe200@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "tqdm>=4.70.1",
]

[project.scripts]
rag-langchain = "rag_langchain:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
